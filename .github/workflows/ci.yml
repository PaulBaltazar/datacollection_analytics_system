name: Test, Scan, and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - enter-data
          - analytics-service
          - show-results

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -t local/${{ matrix.service }}:test \
            ./${{ matrix.service }}

      - name: Run Python tests
        if: matrix.service != 'show-results'
        run: |
          docker run --rm \
            -e JWT_SECRET_KEY=ci-only-dummy-signing-key-not-for-deployment \
            -e MYSQL_HOST=mysql \
            -e MYSQL_DATABASE=student_analytics \
            -e MYSQL_USER=test_user \
            -e MYSQL_PASSWORD=test_only_password \
            -e MONGO_URI=mongodb://localhost:27017 \
            -e MONGO_DB=student_analytics \
            -e AUTH_URL=http://auth-service:5000 \
            -v "${{ github.workspace }}/${{ matrix.service }}/tests:/app/tests:ro" \
            local/${{ matrix.service }}:test \
            python -m pytest tests -v -p no:cacheprovider

      - name: Run Show Results tests
        if: matrix.service == 'show-results'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/show-results/tests:/app/tests:ro" \
            local/show-results:test \
            node --test tests/test_results.js

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:test
          format: table
          output: trivy-${{ matrix.service }}.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.service }}
    needs: test-and-scan

    # Publish only when this workflow runs on main, not a PR.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - enter-data
          - analytics-service
          - show-results

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}