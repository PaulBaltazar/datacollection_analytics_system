<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Grade Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 60px auto;
            padding: 0 20px;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 12px;
        }

        button {
            cursor: pointer;
        }

        #message {
            min-height: 24px;
        }
    </style>
</head>
<body>
    <h1>Student Grade Entry</h1>

    <section id="loginSection">
        <h2>Log in</h2>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" maxlength="50"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>
    </section>

    <section id="gradeSection" hidden>
        <h2>Enter a grade</h2>

        <form id="gradeForm">
            <label for="courseName">Course name</label>
            <input id="courseName" maxlength="100" required>

            <label for="grade">Grade</label>
            <input id="grade" type="number"
                   min="0" max="100" step="0.01" required>

            <button type="submit">Save grade</button>
        </form>

        <button id="logoutButton" type="button">Log out</button>
    </section>

    <p id="message" role="status"></p>

    <script>
        let token = null;

        const loginSection = document.getElementById("loginSection");
        const gradeSection = document.getElementById("gradeSection");
        const message = document.getElementById("message");

        function logout() {
            token = null;
            loginSection.hidden = false;
            gradeSection.hidden = true;
            document.getElementById("gradeForm").reset();
        }

        document.getElementById("loginForm").addEventListener(
            "submit", async (event) => {
                event.preventDefault();
                message.textContent = "";

                try {
                    const response = await fetch("/login", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            username: document.getElementById("username").value,
                            password: document.getElementById("password").value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        message.textContent = data.error || "Login failed";
                        return;
                    }

                    token = data.access_token;
                    document.getElementById("loginForm").reset();
                    loginSection.hidden = true;
                    gradeSection.hidden = false;
                    message.textContent = "Logged in successfully";
                } catch {
                    message.textContent = "Unable to connect. Please try again.";
                }
            }
        );

        document.getElementById("gradeForm").addEventListener(
            "submit", async (event) => {
                event.preventDefault();
                message.textContent = "";

                try {
                    const response = await fetch("/api/grades", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            course_name: document.getElementById("courseName").value,
                            grade: document.getElementById("grade").value
                        })
                    });

                    const data = await response.json();

                    if (response.status === 401) {
                        logout();
                    }

                    if (!response.ok) {
                        message.textContent = data.error || "Unable to save grade";
                        return;
                    }

                    document.getElementById("gradeForm").reset();
                    message.textContent = data.message;
                } catch {
                    message.textContent = "Unable to connect. Please try again.";
                }
            }
        );

        document.getElementById("logoutButton").addEventListener(
            "click", () => {
                logout();
                message.textContent = "Logged out";
            }
        );
    </script>
</body>
</html>
